<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de Formulários</title>
</head>
<body>

    <h1>Exercício de Formulários</h1>

    <form action="processa.html">

        <fieldset>
            <legend>Dados Pessoais</legend>
            Nome <br> <input type="text" name="nome" id="nome" placeholder=""> <br>

            Email <br> <input type="text" name="email" id="email" placeholder=""> <br>
            <input type="checkbox" name="not" id="checkbox"> Quero receber o e-mail

            <br><br>

            Senha <br> <input type="password" name="senha" id="senha">
        </fieldset>

        <fieldset>

            <legend>Informções Adicionais</legend>
            <input type="radio" name="pessoa" id="pessoaf" value="pf">
            <label for="pessoaf">Pessoa Física</label>

            <input type="radio" name="pessoa" id="pessoaj" value="pj">
            <label for="pessoaj">Pessoa Jurídica</label>
            
        </fieldset>
        <br>

        <input type="submit" value="Cadastrar">

    </form>
    
</body>
</html>
